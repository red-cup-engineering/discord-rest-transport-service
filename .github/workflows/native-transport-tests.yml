name: Native Discord transport tests

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/native-transport-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install actual transport dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test Discord source-native transport
        run: npm test
